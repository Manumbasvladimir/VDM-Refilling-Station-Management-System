{% extends 'layouts/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container mt-5">

    <h2>Login</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Username">
        </div>

        <div class="mb-3">
            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Password">
        </div>

        <button class="btn btn-primary">
            Login
        </button>

    </form>

    <br>

    <a href="{% url 'accounts:register' %}">
        Create an account
    </a>

</div>
{% endblock %}
