{% extends "layouts/dashboard.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block dashboard_content %}

<div class="card">

    <div class="card-header">
        <h3>Edit Profile</h3>
    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="mt-3">

                <button type="submit" class="btn btn-primary">
                    💾 Save Changes
                </button>

                <a
                    href="{% url 'customers:profile' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
